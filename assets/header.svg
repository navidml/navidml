<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace">
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2=".35" y2="1">
  <stop offset="0%" stop-color="#eef4ff"/><stop offset="40%" stop-color="#9dc0ff"/><stop offset="100%" stop-color="#a98bf5"/></linearGradient>
 <linearGradient id="markg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#7aa2f7"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#5eead4"/></linearGradient>
 <linearGradient id="barg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#7aa2f7"/><stop offset="100%" stop-color="#5eead4"/></linearGradient>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/><stop offset="50%" stop-color="#bcd2ff" stop-opacity=".28"/><stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient>
 <radialGradient id="vign" cx=".5" cy=".45" r=".75">
  <stop offset="58%" stop-color="#0d1117" stop-opacity="0"/><stop offset="100%" stop-color="#04060b" stop-opacity=".92"/></radialGradient>
 <clipPath id="lc"><rect x="16" y="60" width="490" height="500" rx="14"/></clipPath>
</defs>
<style>
 text{dominant-baseline:auto}
 .lbl{font-size:11px;letter-spacing:2.6px;fill:#4b5b7a}
 .prow{font-size:10.8px;font-weight:700;fill:url(#skin);opacity:0;animation:rise .5s cubic-bezier(.2,.8,.3,1) forwards}
 .mrow{font-size:15px;fill:url(#markg);opacity:0;animation:rise .5s ease forwards}
 .cap{font-size:13px;fill:#93a9cc;letter-spacing:.5px;opacity:0;animation:rise .6s ease forwards}
 .dim{fill:#4b5b7a}.acc{fill:#5eead4}
 .cur{fill:#7aa2f7;animation:blink 1.05s steps(1) infinite}
 .sweep{animation:sweep 6s cubic-bezier(.45,0,.55,1) infinite}
 .glow{animation:pulse 4s ease-in-out infinite}
 .glitch{animation:glitch 7s steps(1) infinite}
 .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.25,1) forwards}
 @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
 @keyframes grow{to{transform:scaleX(1)}}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
 @keyframes sweep{0%{transform:translateY(-50px)}100%{transform:translateY(530px)}}
 @keyframes pulse{0%,100%{opacity:.28}50%{opacity:.8}}
 @keyframes glitch{0%,92%{transform:translate(0,0);opacity:0}93%{transform:translate(-3px,1px);opacity:.5}
  95%{transform:translate(3px,-1px);opacity:.35}97%{transform:translate(-2px,0);opacity:.45}98%,100%{opacity:0}}
</style>
<rect width="1000" height="580" rx="18" fill="#0d1117"/><rect width="1000" height="580" rx="18" fill="url(#vign)"/>
