<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Navid Bordbar — Data Scientist and AI Engineer</title>
  <desc id="desc">A dark blue and violet banner illustrating a path from data to models to intelligent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#10182A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8AA4D6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#bg)" stroke="#273557" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#glow)"/>
  <path d="M0 315C225 270 347 354 566 305C796 254 959 286 1200 218V340H0Z" fill="#7AA2F7" opacity="0.035"/>

  <g transform="translate(72 68)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#5EEAD4" font-size="14" font-weight="700" letter-spacing="4">DATA • MODELS • SYSTEMS</text>
    <text x="0" y="72" fill="#F5F7FF" font-size="58" font-weight="750" letter-spacing="-1.5">Navid Bordbar</text>
    <rect x="0" y="92" width="450" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="139" fill="#B9C7E6" font-size="25" font-weight="500">Data Scientist  ·  AI Engineer</text>
    <text x="0" y="181" fill="#7083A8" font-size="17">Python-first • Computer Vision • NLP • Analytics • Automation</text>
  </g>

  <g transform="translate(720 60)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M70 68L197 35L330 84M70 68L184 137M197 35L184 137L330 84M184 137L298 190M330 84L298 190" fill="none" stroke="#7AA2F7" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M70 68L184 137L298 190" fill="none" stroke="url(#accent)" stroke-width="3"/>

    <g filter="url(#softGlow)">
      <circle cx="70" cy="68" r="10" fill="#5EEAD4"/>
      <circle cx="184" cy="137" r="12" fill="#7AA2F7"/>
      <circle cx="298" cy="190" r="10" fill="#A78BFA"/>
    </g>
    <circle cx="197" cy="35" r="7" fill="#182743" stroke="#7AA2F7" stroke-width="2"/>
    <circle cx="330" cy="84" r="7" fill="#182743" stroke="#A78BFA" stroke-width="2"/>

    <g font-size="12" font-weight="700" letter-spacing="2">
      <text x="36" y="102" fill="#7C8FB7">DATA</text>
      <text x="143" y="172" fill="#91A8D4">MODEL</text>
      <text x="266" y="227" fill="#9E8DCE">SYSTEM</text>
    </g>

    <g transform="translate(35 238)">
      <rect x="0" y="0" width="330" height="34" rx="17" fill="#111C31" stroke="#273A60"/>
      <circle cx="21" cy="17" r="4" fill="#5EEAD4"/>
      <text x="38" y="22" fill="#8FA3CA" font-size="12" font-weight="600" letter-spacing="1.3">LEARN • BUILD • ITERATE</text>
    </g>
  </g>
</svg>
